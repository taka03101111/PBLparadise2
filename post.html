<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    名城大学 履修登録共有
                </h1>
                <nav class="nav">
                    <a href="shared-courses.html" class="nav-link active">
                        <i class="fas fa-home"></i>
                        <span>閲覧</span>
                    </a>

                        <i class="fas fa-plus-circle"></i>
                        <span>投稿</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h2>履修登録を投稿する</h2>
                <p class="subtitle">履修登録表の画像やPDFをシェアしよう</p>
            </div>

            <div class="post-form-container">
                <form id="postForm" class="post-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i>
                            投稿者名（ニックネーム可）
                        </label>
                        <input type="text" id="username" name="username" required placeholder="例：情報太郎">
                    </div>

                    <div class="form-group">
                        <label for="grade">
                            <i class="fas fa-graduation-cap"></i>
                            学年
                        </label>
                        <select id="grade" name="grade" required>
                            <option value="">選択してください</option>
                            <option value="1年生">1年生</option>
                            <option value="2年生">2年生</option>
                            <option value="3年生">3年生</option>
                            <option value="4年生">4年生</option>
                            <option value="先輩">先輩（卒業生）</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comment">
                            <i class="fas fa-comment"></i>
                            コメント
                        </label>
                        <textarea id="comment" name="comment" rows="4" placeholder="履修登録の内容や後輩へのアドバイスなどを書いてください..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="fileInput">
                            <i class="fas fa-file-upload"></i>
                            履修登録表（PDF または 画像）
                        </label>
                        <div class="file-upload-area" id="fileUploadArea">
                            <input type="file" id="fileInput" name="file" accept="image/*,application/pdf" required>
                            <div class="file-upload-label">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>ファイルをドラッグ＆ドロップ<br>または<br>クリックしてファイルを選択</p>
                                <span class="file-info">PDF、PNG、JPEG対応（最大10MB）</span>
                            </div>
                        </div>
                        <div id="filePreview" class="file-preview"></div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">
                            <i class="fas fa-times"></i>
                            キャンセル
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i>
                            投稿する
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
