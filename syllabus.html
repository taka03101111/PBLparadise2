    <main class="main-content">
        <div class="container">
            <h2 class="page-title">
                <i class="fas fa-book"></i> シラバス検索
            </h2>
            <p class="page-description">
                科目名、教員名、キーワードで授業を検索できます。授業内容や評価方法などの詳細情報も確認できます。
            </p>

            <!-- 検索フォーム -->
            <section class="search-section">
                <div class="search-form">
                    <div class="search-input-group">
                        <input type="text" id="searchInput" placeholder="科目名、教員名、キーワードで検索">
                        <button id="searchBtn" class="btn btn-primary">
                            <i class="fas fa-search"></i> 検索
                        </button>
                    </div>

                    <div class="advanced-filters">
                        <button id="toggleFilters" class="filter-toggle">
                            <i class="fas fa-sliders-h"></i> 詳細フィルター
                        </button>
                        <div id="filterPanel" class="filter-panel">
                            <div class="filter-grid">
                                <div class="filter-item">
                                    <label for="filterYearSyllabus">対象学年</label>
                                    <select id="filterYearSyllabus">
                                        <option value="">全て</option>
                                        <option value="1">1年生</option>
                                        <option value="2">2年生</option>
                                        <option value="3">3年生</option>
                                        <option value="4">4年生</option>
                                    </select>
                                </div>
                                <div class="filter-item">
                                    <label for="filterSemesterSyllabus">開講学期</label>
                                    <select id="filterSemesterSyllabus">
                                        <option value="">全て</option>
                                        <option value="前期">前期</option>
                                        <option value="後期">後期</option>
                                        <option value="通年">通年</option>
                                    </select>
                                </div>
                                <div class="filter-item">
                                    <label for="filterCategorySyllabus">科目区分</label>
                                    <select id="filterCategorySyllabus">
                                        <option value="">全て</option>
                                        <option value="必修">必修</option>
                                        <option value="選択必修">選択必修</option>
                                        <option value="選択">選択</option>
                                    </select>
                                </div>
                                <div class="filter-item">
                                    <label for="filterDayOfWeek">曜日</label>
                                    <select id="filterDayOfWeek">
                                        <option value="">全て</option>
                                        <option value="月">月曜日</option>
                                        <option value="火">火曜日</option>
                                        <option value="水">水曜日</option>
                                        <option value="木">木曜日</option>
                                        <option value="金">金曜日</option>
                                    </select>
                                </div>
                                <div class="filter-item">
                                    <label for="filterPeriod">時限</label>
                                    <select id="filterPeriod">
                                        <option value="">全て</option>
                                        <option value="1">1限</option>
                                        <option value="2">2限</option>
                                        <option value="3">3限</option>
                                        <option value="4">4限</option>
                                        <option value="5">5限</option>
                                    </select>
                                </div>
                                <div class="filter-item">
                                    <label for="filterCredits">単位数</label>
                                    <select id="filterCredits">
                                        <option value="">全て</option>
                                        <option value="1">1単位</option>
                                        <option value="2">2単位</option>
                                        <option value="3">3単位</option>
                                        <option value="4">4単位</option>
                                    </select>
                                </div>
                            </div>
                            <div class="filter-actions">
                                <button id="applyFilters" class="btn btn-primary">
                                    <i class="fas fa-check"></i> フィルター適用
                                </button>
                                <button id="clearFilters" class="btn btn-secondary">
                                    <i class="fas fa-redo"></i> クリア
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 検索結果 -->
            <section class="results-section">
                <div class="results-header">
                    <h3 class="section-subtitle">
                        <i class="fas fa-list"></i> 検索結果
                    </h3>
                    <div class="results-info">
                        <span id="resultsCount">0件</span>の科目が見つかりました
                    </div>
                </div>
                <div id="syllabusResults" class="syllabus-results">
                    <div class="empty-message">
                        <i class="fas fa-info-circle"></i>
                        <p>検索キーワードを入力するか、フィルターを設定して検索してください。</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- シラバス詳細モーダル -->
    <div id="syllabusModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 class="modal-title">シラバス詳細</h3>
                <button class="modal-close" onclick="closeSyllabusModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="syllabusDetail" class="syllabus-detail">
                <!-- 詳細情報がここに表示されます -->
            </div>
        </div>
    </div>

    <footer class="footer">
