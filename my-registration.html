<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履修登録・成績管理 - 名城大学</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

    <!-- Excel処理 & Supabase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* 時間割独自のスタイル - 1画面収まり対応のためのコンパクト化 */
        .timetable th {
            width: 60px;
            background: #f3f4f6;
            color: #333;
            padding: 2px !important;
            font-size: 0.85rem;
        }

        .timetable td {
            height: 75px;
            vertical-align: top;
            padding: 2px;
            position: relative;
        }

        /* height 110->75, pad 4->2 */

        /* 科目カード */
        .subject-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 3px;
            margin-bottom: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            position: relative;
            /* font 0.85->0.75 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 42px;
            /* 50->42 */
        }

        .subject-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            z-index: 10;
        }

        /* 履修済み（点数あり） */
        .subject-card.registered {
            background-color: #f0f9ff;
            border-color: #bae6fd;
            border-left: 3px solid #0ea5e9;
        }

        /* 再履修科目（黄色/オレンジ） */
        .subject-card.retake {
            background-color: #fffbeb;
            /* 薄い黄色 */
            border-color: #fcd34d;
            /* 黄色の枠 */
            border-left: 3px solid #f59e0b;
            /* 濃いオレンジのアクセント */
        }

        /* 未履修（マスターデータのみ） */
        .subject-card.master {
            background-color: #f9fafb;
            border-left: 3px solid #d1d5db;
            color: #6b7280;
            opacity: 0.9;
        }

        .score-badge {
            background: #22c55e;
            color: white;
            border-radius: 12px;
            padding: 1px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            align-self: flex-end;
            margin-top: 1px;
        }

        .score-badge.failed {
            background: #ef4444;
            /* 赤色 */
        }

        .program-badge {
            display: inline-block;
            padding: 3px 8px;
            background-color: #e0e7ff;
            /* 薄い藍色 */
            color: #4338ca;
            /* 濃い藍色 */
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #c7d2fe;
        }

        /* タグがない場合のメッセージ用 */
        .no-tags {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* コントロールエリア */
        .controls-area {
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .input-box label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
        }

        .btn-primary {
            background-color: #0d47a1;
            /* 濃い青 */
            color: #ffffff !important;
            /* 文字色を白に！ */
            border: 1px solid #0d47a1;
            transition: all 0.3s;
            padding: 6px 12px;
            /* ボタンサイズ縮小 */
            font-size: 0.9rem;
        }

        /* ボタンが無効（disabled）なときのスタイル */
        .btn.disabled {
            opacity: 0.5;
            /* 半透明にする */
            pointer-events: none;
            /* クリックできないようにする */
            background-color: #9ca3af !important;
            /* グレー */
            border-color: #9ca3af !important;
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: #ef4444;
            /* 赤色 */
            color: white;
            border: 1px solid #ef4444;
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            /* 濃い赤 */
        }

        .btn-secondary {
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        /* モーダル調整 */
        .modal-content {
            max-width: 520px;
            width: 95%;
        }

        /* メインコンテンツのパディング上書き */
        .main-content {
            padding: 1rem 0 !important;
            min-height: auto !important;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <h1 class="university-name">名城大学</h1>
                    <p class="department-name">情報工学部 情報工学科</p>
                </div>
                <h2 class="system-title">履修登録システム</h2>
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <div class="container">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html"><i class="fas fa-home"></i>
                        <span>ホーム</span></a></li>
                <li class="nav-item"><a href="shared-courses.html"><i class="fas fa-comments"></i>
                        <span>履修情報共有</span></a></li>
                <li class="nav-item active"><a href="my-registration.html"><i class="fas fa-calendar-check"></i>
                        <span>履修登録</span></a></li>
                <li class="nav-item"><a href="syllabus.html"><i class="fas fa-book"></i>
                        <span>シラバス検索</span></a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">

            <!-- 操作パネル -->
            <div class="controls-area">
                <div class="control-group">

                    <!-- 学籍番号入力 -->
                    <div class="input-box">
                        <label for="studentNumberInput">学籍番号 (必須)</label>
                        <input type="text" id="studentNumberInput" placeholder="2110001"
                            style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 140px;">
                    </div>

                    <!-- Excel読み込み -->
                    <div class="input-box">
                        <label>成績データ取込</label>
                        <label id="importExcelLabel" class="btn btn-primary disabled"
                            style="cursor: pointer; margin: 0; font-size: 0.9rem;">
                            <i class="fas fa-file-excel"></i> Excelを読み込む
                            <input type="file" id="fileInput" accept=".xlsx" style="display: none;">
                        </label>
                    </div>

                    <!-- 学年・学期 -->
                    <div class="input-box">
                        <label>表示切替</label>
                        <div style="display: flex; gap: 5px;">
                            <select id="yearSelect" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                                <option value="1">1年</option>
                                <option value="2" selected>2年</option>
                                <option value="3">3年</option>
                                <option value="4">4年</option>
                            </select>
                            <select id="semesterSelect"
                                style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                                <option value="前期" selected>前期</option>
                                <option value="後期">後期</option>
                            </select>
                        </div>
                    </div>

                    <!-- クラス選択（手動） -->
                    <div class="input-box">
                        <label>クラス</label>
                        <div
                            style="display: flex; gap: 10px; align-items: center; background: #f9f9f9; padding: 5px 10px; border-radius: 6px; border: 1px solid #ddd;">
                            <label style="margin:0; cursor:pointer;"><input type="radio" name="classType" value="A"
                                    checked> Aクラス</label>
                            <label style="margin:0; cursor:pointer;"><input type="radio" name="classType" value="B">
                                Bクラス</label>
                        </div>
                    </div>

                    <!-- 全データ削除 -->
                    <div class="input-box">
                        <label>データ管理</label>
                        <button id="deleteAllBtn" class="btn btn-danger" style="font-size: 0.9rem;">
                            <i class="fas fa-trash-alt"></i> 全データ削除
                        </button>
                    </div>

                    <!-- ダウンロード -->
                    <div class="input-box" style="margin-left: auto;">
                        <label>Excel出力</label>

                        <!-- 1. disabled を削除し、onclick を削除（JSで制御するため） -->
                        <button id="exportBtn" class="btn btn-secondary" style="font-size: 0.9rem;">
                            <i class="fas fa-download"></i> Excelを更新
                        </button>

                        <!-- 2. 出力用ファイル選択フォーム（新規追加・非表示） -->
                        <input type="file" id="exportFileInput" accept=".xlsx" style="display: none;">
                    </div>
                </div>
            </div>

            <!-- 時間割表 -->
            <section class="timetable-section">
                <h3 class="section-subtitle"
                    style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="timetableTitle">2年 前期 の時間割</span>
                    <small style="font-weight: normal; font-size: 0.8rem; color: #666;">
                        <span
                            style="display:inline-block; width:12px; height:12px; background:#e0f2fe; border:1px solid #7dd3fc; margin-right:4px;"></span>履修済
                        <span
                            style="display:inline-block; width:12px; height:12px; background:#f9fafb; border:1px solid #d1d5db; margin-left:10px; margin-right:4px;"></span>未履修
                    </small>
                </h3>
                <div class="timetable-wrapper">
                    <table class="timetable" id="timetable">
                        <thead>
                            <tr>
                                <th>時限</th>
                                <th>月曜日</th>
                                <th>火曜日</th>
                                <th>水曜日</th>
                                <th>木曜日</th>
                                <th>金曜日</th>
                            </tr>
                        </thead>
                        <tbody id="timetableBody">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- 点数編集モーダル -->
    <div id="scoreModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalSubjectName">科目名</h3>
                <button class="modal-close" onclick="closeScoreModal()"><i class="fas fa-times"></i></button>
            </div>
            <div style="padding: 20px;">
                <!-- ▼▼▼ 追加：科目詳細エリア ▼▼▼ -->
                <div class="subject-details"
                    style="background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0;">

                    <!-- 科目区分 -->
                    <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.8rem; color: #64748b; font-weight: bold;">科目区分:</span>
                        <span id="modalCategory" style="font-size: 0.9rem; color: #334155;">-</span>
                    </div>

                    <!-- プログラムタグ -->
                    <div>
                        <span
                            style="font-size: 0.8rem; color: #64748b; font-weight: bold; display: block; margin-bottom: 4px;">プログラム・タグ:</span>
                        <div id="modalTags" style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <!-- JSでバッジを生成します -->
                        </div>
                    </div>
                </div>
                <p style="margin-bottom: 15px;">成績入力（0〜100）</p>
                <input type="number" id="modalScoreInput" class="form-control"
                    style="width: 100%; padding: 10px; font-size: 1.2rem; margin-bottom: 20px;" min="0" max="100">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">

                    <!-- 削除ボタン (初期状態は非表示 style="display:none") -->
                    <button id="deleteScoreBtn" class="btn btn-danger" onclick="deleteScore()" style="display: none;">
                        <i class="fas fa-trash"></i> 削除
                    </button>

                    <!-- 右側のボタングループ -->
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" onclick="closeScoreModal()">キャンセル</button>
                        <button class="btn btn-primary" onclick="saveScore()">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/my-registration.js"></script>
</body>

</html>
